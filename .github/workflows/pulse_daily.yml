name: Pulse Daily Automation

on:
  schedule:
    # Trigger daily at 3:45 AM IST (which is 10:15 PM UTC the night before) to execute around 7:45 AM IST after delays
    - cron: '15 22 * * *'
  workflow_dispatch:
    # Allows manual triggering from the Actions tab on GitHub

env:
  TZ: Asia/Kolkata

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install System Dependencies (FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Recreate YouTube and Google Drive Credentials
        run: |
          mkdir -p credentials
          echo '${{ secrets.YOUTUBE_CLIENT_SECRETS }}' > credentials/client_secrets.json
          echo '${{ secrets.YOUTUBE_TOKEN_JSON }}' > credentials/token.json
          echo '${{ secrets.GDRIVE_TOKEN_JSON }}' > credentials/gdrive_token.json


      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run Pulse Vector Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_PRIVACY_STATUS: ${{ secrets.YOUTUBE_PRIVACY_STATUS || 'public' }}
          YOUTUBE_PLAYLIST_TAG: ${{ secrets.YOUTUBE_PLAYLIST_TAG || 'DailyCurrentAffairs' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          ENABLE_GDRIVE_UPLOAD: ${{ secrets.ENABLE_GDRIVE_UPLOAD || 'true' }}
          ENABLE_SUPABASE_STORAGE_UPLOAD: ${{ secrets.ENABLE_SUPABASE_STORAGE_UPLOAD || 'false' }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python src/pipeline.py --daily

      - name: Push Git Commits
        if: always()
        run: |
          git pull --rebase -X theirs origin main || (git rebase --abort && git pull --no-rebase -X theirs origin main --no-edit || (git checkout --ours . && git add . && git commit -m "Auto-resolve merge conflicts"))
          git push origin main



      - name: Upload Pipeline Logs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: daily-pipeline-logs
          path: logs/
          retention-days: 1
          if-no-files-found: ignore

      - name: Cleanup Credentials
        if: always()
        run: |
          rm -f credentials/client_secrets.json credentials/token.json credentials/gdrive_token.json


