name: Remove old artifacts

on:
  schedule:
    # Runs every day at 1:00 AM UTC
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      purge_all:
        description: 'Purge all artifacts immediately to clear storage quota'
        type: boolean
        default: true

jobs:
  remove-old-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write # Required to delete artifacts
    steps:
      - name: Purge artifacts to clear storage quota
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Scanning and deleting accumulated workflow artifacts..."
          gh api --paginate repos/${{ github.repository }}/actions/artifacts --jq '.artifacts[].id' | while read -r id; do
            if [ -n "$id" ]; then
              echo "Deleting artifact ID: $id"
              gh api --method DELETE "repos/${{ github.repository }}/actions/artifacts/$id" || true
            fi
          done
          echo "✅ Artifact cleanup completed successfully."
